name: CI/CD Pipeline - Nexor RTP Core

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build, ArchUnit & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Verify Dependencies
        run: mvn compile --batch-mode

      - name: Run ArchUnit & Test Suite
        run: mvn test --batch-mode

      - name: Print Surefire failure reports
        if: failure()
        run: |
          echo "========== SUREFIRE FAILURE REPORTS =========="
          for f in target/surefire-reports/*.txt; do
            echo ""
            echo "---------- $f ----------"
            cat "$f"
          done

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/

  security-scan:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    needs: build-and-verify

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (FS & Pom)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          format: 'table'
