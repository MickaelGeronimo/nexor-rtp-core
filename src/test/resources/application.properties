# Schema ownership in tests now matches production exactly: Flyway (V1__..., V2__...) creates
# the schema against the real PostgreSQL container from AbstractContainerizedTest, and Hibernate
# only validates the entities against it (ddl-auto=validate, inherited from application.yml).
#
# Previously this file set spring.flyway.enabled=false and ddl-auto=create-drop against H2, which
# let a broken Flyway migration or a Postgres-only SQL feature (FOR UPDATE, native constraints in
# V1/V2) pass all tests while failing in production. That override has been removed.
#
# Kafka is excluded from autoconfiguration in tests: there is no Kafka broker in the test
# environment (AbstractContainerizedTest only starts PostgreSQL). Excluding it prevents Spring Boot
# from creating a KafkaTemplate that would point at a non-existent localhost:9092 and cause
# OutboxRelayWorker to emit Kafka connect errors every 2 seconds during the test run.
# The @Nullable KafkaTemplate in OutboxRelayWorker handles null gracefully (no-op log).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Security: known test API keys
nexor.security.api-keys.payment-submitter=test-pay-key
nexor.security.api-keys.auditor=test-audit-key
nexor.security.api-keys.admin=test-admin-key
nexor.security.rate-limit.requests-per-minute=10000
