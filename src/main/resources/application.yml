server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: nexor-rtp-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:nexor_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        payment.orchestration.latency: true

logging:
  level:
    root: INFO
    com.nexor.payments: DEBUG
    # Suppress Hibernate SQL spam in development; enable only for troubleshooting
    org.hibernate.SQL: WARN

# ============================================================
# Nexor RTP Core — Application-specific configuration
# Override via environment variables in production.
# ============================================================
nexor:
  security:
    api-keys:
      # In production: replace with long random secrets from AWS Secrets Manager / Vault
      # NEVER commit real keys to source control.
      payment-submitter: ${NEXOR_API_KEY_PAYMENT_SUBMITTER:nexor-pay-key-dev}
      auditor: ${NEXOR_API_KEY_AUDITOR:nexor-audit-key-dev}
      admin: ${NEXOR_API_KEY_ADMIN:nexor-admin-key-dev}
    rate-limit:
      # Requests per minute per API key (per JVM instance — see ADR-007 for multi-instance gap)
      requests-per-minute: ${NEXOR_RATE_LIMIT_RPM:100}
